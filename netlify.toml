[build]
  command = "node fetch-feedback.js; node build.js"
  publish = "dist"

[build.environment]
  SITE_URL = "https://foutcodezoeker.nl"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://foutcode.goatcounter.com; connect-src 'self' https://foutcode.goatcounter.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[redirects]]
  from = "/storing-telefoon-laadt-niet-laadpoort-voorkomen"
  to = "/storing-telefoon-laadt-niet-laadpoort-pluis-in-de-laadpoort-voorkomen"
  status = 301

[[redirects]]
  from = "/storing-telefoonscherm-gebarsten-voorkomen"
  to = "/storing-telefoonscherm-gebarsten-gebarsten-scherm-voorkomen"
  status = 301

[[redirects]]
  from = "/brokk-sloopRobot"
  to = "/brokk-sloop-robot"
  status = 301

[[redirects]]
  from = "/foutcode-brokk-sloopRobot-*"
  to = "/foutcode-brokk-sloop-robot-:splat"
  status = 301

[[redirects]]
  from = "/compressoren"
  to = "/gereedschap"
  status = 301
